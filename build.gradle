plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.116'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

apply plugin: 'maven-publish'

version = "$minecraft_version-$mod_version"
group = 'com.smashingmods'
archivesBaseName = 'alchemistry'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Wire Alchemistry's access transformer into the NeoGradle build.
// The AT name-form (f_43902_ -> values) is handled separately; this only registers the file.
minecraft {
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }
}

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach { run ->
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main

        // Auto-accept the Minecraft EULA for dev runs. The dedicated server (and any run that
        // boots server-side logic) refuses to start until eula.txt reads "eula=true"; without this
        // every fresh run dir stops at the EULA prompt. We write the flag into each run's own
        // working directory just before launch so it is always present and never needs manual
        // acceptance. Dev/test only -- this is not redistributed and does not touch a user install.
        def runName = run.name.capitalize()
        def acceptEula = project.tasks.register("acceptEula${runName}") {
            def eulaFile = run.workingDirectory.file('eula.txt')
            outputs.file(eulaFile)
            doLast {
                def target = eulaFile.get().asFile
                target.parentFile.mkdirs()
                target.text = "# Auto-generated by the acceptEula${runName} Gradle task for dev runs.\n" +
                        "# Indicates agreement to the Minecraft EULA (https://aka.ms/MinecraftEULA).\n" +
                        "eula=true\n"
            }
        }
        run.dependsOn acceptEula
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // Run the gametest world under build/ so it is ephemeral (wiped by `clean`) instead of leaving a
        // committed run dir. The configureEach acceptEula task above reads this same workingDirectory, so the
        // EULA flag lands in build/gametest/eula.txt automatically.
        workingDirectory = layout.buildDirectory.dir('gametest')
    }

    data {
        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Silent dev client: stamp a sound-off options.txt into the runClient working directory before every launch
// so client runs never blast audio while working. Overwrites each run on purpose - these are throwaway test runs.
tasks.register('prepareSilentClientOptions', Copy) {
    description = 'Copies the sound-off options.txt template into the runClient working directory.'
    from 'run-config/options.txt'
    into runs.named('client').flatMap { it.workingDirectory }
}

tasks.named('runClient') {
    dependsOn 'prepareSilentClientOptions'
}

// Stage the gametest structure template(s) into the gameTestServer working directory before launch.
// On 1.20.2 the SNBT (text) structure format is only read from a `gameteststructures/` directory relative to
// the run's working dir (StructureTemplateManager registers that source under IS_RUNNING_IN_IDE, and
// StructureUtils falls back to the same path); the resource-pack loader handles binary .nbt only. With
// @PrefixGameTestTemplate(false) the framework resolves `alchemistry:loadsemptytemplate` to the un-prefixed
// file gameteststructures/loadsemptytemplate.snbt -- so the source template lives outside src/main/resources
// (keeping it out of the published jar) and is copied in here.
tasks.register('prepareGameTestStructures', Copy) {
    description = 'Stages the gametest SNBT structure templates into the gameTestServer working directory.'
    from 'src/main/gametest'
    include '*.snbt'
    into runs.named('gameTestServer').flatMap { it.workingDirectory.dir('gameteststructures') }
}

tasks.named('runGameTestServer') {
    dependsOn 'prepareGameTestStructures'
}

repositories {
    mavenLocal()
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.tamaized.com/releases" }
    // JUnit (org.junit.*) is not mirrored by the repos above; settings.gradle has no
    // dependencyResolutionManagement, so the test deps need Maven Central here.
    mavenCentral()
}

dependencies {
    // Specify the version of Minecraft to use. NeoGradle treats this dependency as if it were a normal library.
    implementation "net.neoforged:neoforge:${neo_version}"

    // Consume ChemLib + AlchemyLib from mavenLocal. NeoGradle remaps mod dependencies declared with a plain configuration, so no 'mod' prefix is needed.
    implementation "smashingmods:chemlib:${minecraft_version}-${chemlib_version}"
    implementation "smashingmods:alchemylib:${minecraft_version}-${alchemylib_version}"

    // JEI: the common API is declared for compile time use only.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // JEI: no NeoForge build for MC 1.20.2 (the -forge jar's loaderVersion=[48,) rejects NeoForge); @JeiPlugin
    // compiles against the common-api but stays dormant at runtime this phase -- D6.
    // Patchouli: dropped this phase -- no 1.20.2 Patchouli build (D6 gap); the guidebook is gated separately.

    // JUnit 5 for the plain-JUnit `test` source set. testImplementation extends implementation,
    // so the Minecraft classpath (net.neoforged:neoforge above) is inherited by the test compile/runtime.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        chemlib_version: chemlib_version, alchemylib_version: alchemylib_version
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    // The gametest holder lives in src/main so the mod scan registers it for the gameTestServer run, but it
    // is test-only scaffolding and must not ship in the published jar.
    exclude 'com/smashingmods/alchemistry/gametest/**'

    manifest {
        attributes([
                "Specification-Title"     : "$archivesBaseName",
                "Specification-Vendor"    : "SmashingMods",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "SmashingMods",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def secrets = new Properties()
file('secrets.properties').withInputStream {
    stream -> secrets.load(stream)
}

fileTree("secrets").matching {
    include "**/*.properties"
}.each {
    File file ->
        file.withInputStream {
            stream -> secrets.load(stream)
        }
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            afterEvaluate {
                artifact project.jar
                artifact project.sourcesJar
                artifact project.javadocJar
            }
            setGroupId 'smashingmods'
            setArtifactId 'alchemistry'
        }
    }
    repositories {
        maven {
            url "https://maven.tamaized.com/releases"
            credentials {
                username secrets.getProperty("maven_username")
                password secrets.getProperty("maven_password")
            }
        }
    }
}

