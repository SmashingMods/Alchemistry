modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/smashingmods/alchemistry/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="alchemistry-logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="chemlib"
    type="required"
    versionRange="[${chemlib_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="alchemylib"
    type="required"
    versionRange="[${alchemylib_version},)"
    ordering="NONE"
    side="BOTH"

# Patchouli is an optional integration: when present it loads the guidebook (assets/data under patchouli_books/),
# but Alchemistry runs fine without it, so this is type="optional" rather than "required".
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"
