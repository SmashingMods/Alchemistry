plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

apply plugin: 'maven-publish'

version = "$minecraft_version-$mod_version"
group = 'com.smashingmods'
archivesBaseName = 'alchemistry'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        neoForgeVersion = "${minecraft_version}-${forge_version}"
    }

    parchment {
        minecraftVersion = mapping_version_minecraft
        mappingsVersion = mapping_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        alchemistry {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Silent dev client: stamp a sound-off options.txt into the runClient game directory before every launch
// so client runs never blast audio while working. Overwrites each run on purpose - these are throwaway test runs.
tasks.register('prepareSilentClientOptions', Copy) {
    description = 'Copies the sound-off options.txt template into the runClient game directory.'
    from 'run-config/options.txt'
    into tasks.named('runClient').flatMap { it.gameDirectory }
}

tasks.named('runClient') {
    dependsOn 'prepareSilentClientOptions'
}

repositories {
    mavenLocal()
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.tamaized.com/releases" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    modImplementation "smashingmods:chemlib:${minecraft_version}-${chemlib_version}"
    modImplementation "smashingmods:alchemylib:${minecraft_version}-${alchemylib_version}"

    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    modCompileOnly "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-FORGE:api"
    modRuntimeOnly "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-FORGE"

//    modRuntimeOnly "curse.maven:ctm-267602:3737369"
//    modRuntimeOnly "curse.maven:mekanism-268560:4020942"
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        chemlib_version: chemlib_version, alchemylib_version: alchemylib_version
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "$archivesBaseName",
                "Specification-Vendor"    : "SmashingMods",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "SmashingMods",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def secrets = new Properties()
file('secrets.properties').withInputStream {
    stream -> secrets.load(stream)
}

fileTree("secrets").matching {
    include "**/*.properties"
}.each {
    File file ->
        file.withInputStream {
            stream -> secrets.load(stream)
        }
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            afterEvaluate {
                artifact project.jar
                artifact project.sourcesJar
                artifact project.javadocJar
            }
            setGroupId 'smashingmods'
            setArtifactId 'alchemistry'
        }
    }
    repositories {
        maven {
            url "https://maven.tamaized.com/releases"
            credentials {
                username secrets.getProperty("maven_username")
                password secrets.getProperty("maven_password")
            }
        }
    }
}

