plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

apply plugin: 'maven-publish'

version = "$minecraft_version-$mod_version"
group = 'com.smashingmods'
archivesBaseName = 'alchemistry'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Wire Alchemistry's access transformer into the NeoGradle build.
// The AT name-form (f_43902_ -> values) is handled separately; this only registers the file.
minecraft {
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }
}

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach { run ->
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main

        // Auto-accept the Minecraft EULA for dev runs. The dedicated server (and any run that
        // boots server-side logic) refuses to start until eula.txt reads "eula=true"; without this
        // every fresh run dir stops at the EULA prompt. We write the flag into each run's own
        // working directory just before launch so it is always present and never needs manual
        // acceptance. Dev/test only -- this is not redistributed and does not touch a user install.
        def runName = run.name.capitalize()
        def acceptEula = project.tasks.register("acceptEula${runName}") {
            def eulaFile = run.workingDirectory.file('eula.txt')
            outputs.file(eulaFile)
            doLast {
                def target = eulaFile.get().asFile
                target.parentFile.mkdirs()
                target.text = "# Auto-generated by the acceptEula${runName} Gradle task for dev runs.\n" +
                        "# Indicates agreement to the Minecraft EULA (https://aka.ms/MinecraftEULA).\n" +
                        "eula=true\n"
            }
        }
        run.dependsOn acceptEula.get()
    }

    client { run ->
        // NeoGradle 7.1 no longer infers a run's type from the block name; declare it explicitly.
        runType "client"

        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

        // Silent dev client: stamp a sound-off options.txt into the runClient working directory before every
        // launch so client runs never blast audio while working. The same template also pins guiScale:3 so every
        // runClient launches at a readable GUI scale. Overwrites each run on purpose - these are throwaway test
        // runs. Defined inside the client block (referencing this run's workingDirectory) because NeoGradle 7.1 no
        // longer resolves the run by name via runs.named('client')/the runClient task.
        def silentOptions = project.tasks.register('prepareSilentClientOptions', Copy) {
            description = 'Copies the sound-off, guiScale:3 options.txt template into the runClient working directory.'
            from project.file('run-config/options.txt')
            into run.workingDirectory
        }
        run.dependsOn silentOptions.get()
    }

    server { run ->
        runType "server"
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'

        // Auto-op the dev player on every runServer. The NeoGradle dev client connects offline as username "Dev"
        // (no auth-player override is set in this runs{} block), whose offline UUID is the namespaced hash
        // UUID.nameUUIDFromBytes("OfflinePlayer:Dev") = 380df991-f603-344c-a090-369bad2a924a. The dedicated server
        // reads ops.json once at startup, so we stamp it into the run's working directory before launch -- giving
        // the dev player level-4 (full) operator rights every run without a manual /op. Mirrors the acceptEula task
        // above and, like it, is defined inside this block referencing this run's workingDirectory (NeoGradle 7.1 no
        // longer resolves the run via runs.named('server')/the runServer task). Dev/test only -- runs/ is gitignored
        // and never published.
        def opsDevServer = project.tasks.register('prepareDevServerOps') {
            def opsFile = run.workingDirectory.file('ops.json')
            outputs.file(opsFile)
            doLast {
                def target = opsFile.get().asFile
                target.parentFile.mkdirs()
                target.text = '''[
  {
    "uuid": "380df991-f603-344c-a090-369bad2a924a",
    "name": "Dev",
    "level": 4,
    "bypassesPlayerLimit": true
  }
]
'''
            }
        }
        run.dependsOn opsDevServer.get()

        // Force creative on the dev server, durably. gamemode=creative sets the default mode for joining players;
        // force-gamemode=true re-applies it on every join so saved player data can never leave the dev player stuck
        // in survival. We update only these two keys (read-modify-write) instead of overwriting the whole file,
        // because Minecraft owns the other ~60 entries in server.properties and regenerates/rewrites it on shutdown;
        // clobbering them would fight the server. If the file is absent (fresh run dir) we write just these keys and
        // the server fills in the rest at startup. Mirrors the acceptEula/ops tasks' shape; same workingDirectory
        // reasoning. Dev/test only.
        def propsDevServer = project.tasks.register('prepareDevServerProperties') {
            def propsFile = run.workingDirectory.file('server.properties')
            outputs.file(propsFile)
            doLast {
                def target = propsFile.get().asFile
                target.parentFile.mkdirs()
                def forced = ['gamemode': 'creative', 'force-gamemode': 'true']
                def lines = target.exists() ? target.readLines('UTF-8') : []
                def seen = [] as Set
                def merged = lines.collect { line ->
                    def m = (line =~ /^\s*([\w.-]+)\s*=/)
                    if (m && forced.containsKey(m.group(1))) {
                        def key = m.group(1)
                        seen << key
                        "${key}=${forced[key]}"
                    } else {
                        line
                    }
                }
                forced.each { key, value -> if (!seen.contains(key)) merged << "${key}=${value}" }
                target.text = merged.join('\n') + '\n'
            }
        }
        run.dependsOn propsDevServer.get()
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer { run ->
        runType "gameTestServer"
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // Run the gametest world under build/ so it is ephemeral (wiped by `clean`) instead of leaving a
        // committed run dir. The configureEach acceptEula task above reads this same workingDirectory, so the
        // EULA flag lands in build/gametest/eula.txt automatically.
        workingDirectory = layout.buildDirectory.dir('gametest')

        // Stage the gametest structure template(s) into the gameTestServer working directory before launch.
        // The SNBT (text) structure format is only read from a `gameteststructures/` directory relative to
        // the run's working dir (StructureTemplateManager registers that source under IS_RUNNING_IN_IDE, and
        // StructureUtils falls back to the same path); the resource-pack loader handles binary .nbt only. With
        // @PrefixGameTestTemplate(false) the framework resolves `alchemistry:loadsemptytemplate` to the un-prefixed
        // file gameteststructures/loadsemptytemplate.snbt -- so the source template lives outside src/main/resources
        // (keeping it out of the published jar) and is copied in here. Defined inside the gameTestServer block
        // (referencing this run's workingDirectory) because NeoGradle 7.1 no longer resolves the run by name via
        // runs.named('gameTestServer')/the runGameTestServer task.
        def gameTestStructures = project.tasks.register('prepareGameTestStructures', Copy) {
            description = 'Stages the gametest SNBT structure templates into the gameTestServer working directory.'
            from project.file('src/main/gametest')
            include '*.snbt'
            into run.workingDirectory.dir('gameteststructures')
        }
        run.dependsOn gameTestStructures.get()

        // Close the gate-hole: fail the build when the gametest run does NOT genuinely load the chain and pass
        // every required test. NeoGradle creates runGameTestServer as a plain JavaExec, and a JavaExec normally
        // fails on a non-zero forked exit. But on a mod-load crash the forked JVM still exits 0: vanilla's
        // net.minecraft.server.Main wraps the whole startup in a try/catch that only logs "Failed to start the
        // minecraft server" and returns, so the ModLoadingException never propagates to an exit code. The only
        // non-zero exit comes from GameTestServer.onServerExit (System.exit(failedRequiredCount)), which never
        // runs if the crash happens before the test server starts ticking. The exit code is therefore unreliable
        // for the crash-before-tests case, so we verify by scanning the run's own console output instead.
        //
        // The run task is referenced by its NeoGradle-generated name (runGameTestServer) because, as noted above,
        // NeoGradle 7.1 no longer resolves the run by name via runs.named('gameTestServer'). NeoGradle creates the
        // run tasks lazily during project evaluation, so the lookup is deferred into afterEvaluate -- the task does
        // not exist yet while this run block is being configured.
        def gameTestLog = layout.buildDirectory.file('runGameTestServer.log')
        project.afterEvaluate {
            project.tasks.named('runGameTestServer', JavaExec).configure { task ->
                task.outputs.file(gameTestLog)
                // Declaring an output above makes Gradle's incremental engine eligible to skip the whole task
                // (server run + the doFirst/doLast gate) as UP-TO-DATE on a second run with unchanged inputs --
                // which would report BUILD SUCCESSFUL with no verification ever happening. A run task is a smoke
                // gate, never up-to-date: force it to always execute so the verify step runs every time. The
                // outputs.file declaration stays purely so `clean` tracks and wipes the captured log.
                task.outputs.upToDateWhen { false }
                // Capture the forked server's console output to a log file the verify step below scans. The stream
                // is a single plain FileOutputStream (not a tee back to the Gradle console): JavaExec pumps the
                // process output on a dedicated thread, and a wrapper that fans out to two sinks can deadlock the
                // forked JVM if either leg stalls -- a file sink never blocks. A developer still gets a live copy
                // via the server's own log4j appender at build/gametest/logs/latest.log; this captured file is the
                // machine-readable copy the gate reads. Opened in doFirst so it exists only when the run executes,
                // and stashed on the task so doLast can flush + close it deterministically.
                task.doFirst {
                    def logFile = gameTestLog.get().asFile
                    logFile.parentFile.mkdirs()
                    def fileOut = new BufferedOutputStream(new FileOutputStream(logFile))
                    task.ext.gameTestLogStream = fileOut
                    task.standardOutput = fileOut
                    task.errorOutput = fileOut
                }
                // doLast runs after the exec action. On a mod-load crash the exec action "succeeds" (exit 0) so this
                // still runs and fails the build; on a genuine non-zero exit the exec action fails first, which also
                // fails the build -- either way an unhealthy run never reports BUILD SUCCESSFUL.
                task.doLast {
                    (task.ext.has('gameTestLogStream') ? task.ext.gameTestLogStream : null)?.with { it.flush(); it.close() }
                    def log = gameTestLog.get().asFile
                    def text = log.exists() ? log.getText('UTF-8') : ''

                    // Any of these means the chain crashed at (or before) mod load -- the exact failures this gate
                    // exists to catch. "required tests failed" covers a booted run where a required gametest failed.
                    def crashMarkers = ['ModLoadingException', 'Failed to start the minecraft server',
                                        'invalid dist', 'LoadingFailed', 'required tests failed']
                    def hit = crashMarkers.find { text.contains(it) }
                    if (hit != null) {
                        throw new GradleException("runGameTestServer FAILED: crash marker '${hit}' found in ${log}. " +
                                "The chain did not load cleanly / a required test failed. See the log for the stack trace.")
                    }

                    // The chain must have booted far enough to actually run the gametests...
                    if (!text.contains('Started game test server') || !(text =~ /\d+ tests are now running/)) {
                        throw new GradleException("runGameTestServer FAILED: the gametest batch never started " +
                                "(no 'Started game test server' / 'N tests are now running' in ${log}). " +
                                "The server exited before reaching the in-world test phase.")
                    }

                    // ...and every required test must have passed (GameTestServer logs this once all tests finish).
                    if (!(text =~ /All \d+ required tests passed/)) {
                        throw new GradleException("runGameTestServer FAILED: success marker 'All N required tests " +
                                "passed' not found in ${log}. The run did not complete with all required tests green.")
                    }

                    def passLine = (text =~ /All \d+ required tests passed/)[0]
                    logger.lifecycle("runGameTestServer verified: chain loaded and ${passLine}.")
                }
            }
        }
    }

    data {
        runType "data"
        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.tamaized.com/releases" }
    // CurseMaven serves the dev-only power/pipes test mods (GeneratorGalore, Pipez) pulled in as runtimeOnly
    // below. Scoped to the curse.maven group so it is only consulted for those coordinates.
    maven { url "https://www.cursemaven.com"; content { includeGroup "curse.maven" } }
    // JUnit (org.junit.*) is not mirrored by the repos above; settings.gradle has no
    // dependencyResolutionManagement, so the test deps need Maven Central here.
    mavenCentral()
}

dependencies {
    // Specify the version of Minecraft to use. NeoGradle treats this dependency as if it were a normal library.
    implementation "net.neoforged:neoforge:${neo_version}"

    // Consume ChemLib + AlchemyLib from mavenLocal. NeoGradle remaps mod dependencies declared with a plain configuration, so no 'mod' prefix is needed.
    implementation "smashingmods:chemlib:${minecraft_version}-${chemlib_version}"
    implementation "smashingmods:alchemylib:${minecraft_version}-${alchemylib_version}"

    // JEI: compiled against the NeoForge API (which transitively pulls in the common API), because the Atomizer
    // and Liquifier categories reference NeoForgeTypes.FLUID_STACK for their fluid slots -- that symbol lives in the
    // neoforge-api jar, not the common-api jar. The NeoForge build supplies the runtime implementation. As of MC
    // 1.20.4 a NeoForge-flavored JEI exists, so JEI is an active (optional) integration again -- it loads at runtime
    // when present and the plugin renders the recipe categories.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // Patchouli: a NeoForge build exists again as of MC 1.20.4, so the guidebook is an active (optional)
    // integration -- it loads the book at runtime when present. The book is pure data (JSON under
    // patchouli_books/), with no Java referencing the vazkii.patchouli.api package, so the single-jar
    // compileOnly + runtimeOnly shape is enough; no separate -api artifact is needed. Mirrors JEI's optional shape.
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Dev-only power/pipes test mods, runtimeOnly so they load in runClient/runServer for hands-on testing of
    // Alchemistry's FE machines and fluid/item handling. Pure runtime: no source compiles against them, they are
    // NOT listed as dependencies in neoforge.mods.toml, and the publication below bundles only our jar/sources/
    // javadoc -- so they are never shipped and never a load requirement of the released mod.
    runtimeOnly "curse.maven:generatorgalore-691049:6799851" // GeneratorGalore -- FE generators
    runtimeOnly "curse.maven:pipez-443900:5609056"           // Pipez -- item/fluid/energy pipes

    // JUnit 5 for the plain-JUnit `test` source set. testImplementation extends implementation,
    // so the Minecraft classpath (net.neoforged:neoforge above) is inherited by the test compile/runtime.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

def resourceTargets = ['META-INF/neoforge.mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        chemlib_version: chemlib_version, alchemylib_version: alchemylib_version
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    // The gametest holder lives in src/main so the mod scan registers it for the gameTestServer run, but it
    // is test-only scaffolding and must not ship in the published jar.
    exclude 'com/smashingmods/alchemistry/gametest/**'

    manifest {
        attributes([
                "Specification-Title"     : "$archivesBaseName",
                "Specification-Vendor"    : "SmashingMods",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "SmashingMods",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def secrets = new Properties()
file('secrets.properties').withInputStream {
    stream -> secrets.load(stream)
}

fileTree("secrets").matching {
    include "**/*.properties"
}.each {
    File file ->
        file.withInputStream {
            stream -> secrets.load(stream)
        }
}

java {
    withSourcesJar()
    withJavadocJar()
}

// Keep the test-only gametest scaffolding out of the published sources jar too, mirroring the binary jar exclude.
tasks.named('sourcesJar') { exclude 'com/smashingmods/alchemistry/gametest/**' }

// Keep it out of the published javadoc jar as well; excluding from javadoc generation also avoids docs warnings on it.
tasks.named('javadoc') { exclude 'com/smashingmods/alchemistry/gametest/**' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            afterEvaluate {
                artifact project.jar
                artifact project.sourcesJar
                artifact project.javadocJar
            }
            setGroupId 'smashingmods'
            setArtifactId 'alchemistry'
        }
    }
    repositories {
        maven {
            url "https://maven.tamaized.com/releases"
            credentials {
                username secrets.getProperty("maven_username")
                password secrets.getProperty("maven_password")
            }
        }
    }
}

// CurseForge publishing disabled; re-enable when release credentials/game-versions are set.
// cursegradle plugin left applied but dormant. See PORTING_LOG.
